description:
  en:
    localisedName: cddl4j
    genericName: cddl4j Java CDDL and CBOR library
    shortDescription: Java library for validating CBOR data against CDDL schemas and working with CBOR values.
    longDescription: >
      cddl4j is a Java 8 library for applications that exchange CBOR encoded binary data and need a schema-driven
      validation layer. It parses RFC 8949 CBOR and RFC 8610 CDDL, compiles schemas into reusable immutable
      validation models, and validates CBOR payloads. 
      The project also includes a self-contained CBOR data model, decoder, encoder, deterministic encoding and
      semantic-tag helpers.
    features:
      - Create and parse CBOR data model.
      - Validate CBOR payloads against CDDL schemas.
      - Extend schemas with application-defined rules and custom control operators.

